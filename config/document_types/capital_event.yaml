# Capital-event workbook document type.
#
# Event types are chosen by the user at upload time. Each declares the sheet roles
# the tool processes for that event; every other sheet in the (long-lived) workbook
# is inventoried but not serialized, mapped or sent to an LLM.
#
# Sheet roles: allocation, itd, summary, merge, mgmt_fee, investor_data,
# holiday_calendar, other.
#
# The list was confirmed by the Petra fund accountants (calibration item 15). The fee tab
# is processed when present, but a call does not always carry a management fee. Support
# tabs (a distribution waterfall, expense breakouts) are not a role: any visible tab linked
# to or from the Allocation or Summary is scanned, and CE-TIE-SUPPORT-TABS ties the ones the
# Allocation pulls from.

event_types:
  - id: capital_call
    label: Capital Call
    relevant_roles: [allocation, itd, summary, merge, mgmt_fee, investor_data, holiday_calendar]
  - id: distribution
    label: Distribution
    relevant_roles: [allocation, itd, summary, merge, investor_data, holiday_calendar]
  - id: net_event
    label: Net Event (call and distribution)
    relevant_roles: [allocation, itd, summary, merge, mgmt_fee, investor_data, holiday_calendar]
