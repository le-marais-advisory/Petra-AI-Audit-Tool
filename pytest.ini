[pytest]
pythonpath = .
addopts = -m "not integration and not eval" --tb=short
markers =
    integration: end-to-end tests that run the live validation pipeline (requires API keys, slow)
    eval: live-LLM evals for the workbook pipeline (layout mapping, role assignment, hybrid rules)
    critical: rule severity=critical in rules.json
    major: rule severity=major in rules.json
    minor: rule severity=minor in rules.json
