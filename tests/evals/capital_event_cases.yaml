# Hybrid-rule eval cases (live LLM). Each case names a generated fixture
# (event_type / variant / defect from tests/fixtures/generate_capital_event_fixtures.py)
# and the expected verdicts for the hybrid rules it exercises. Deterministic rules are
# covered offline by tests/test_workbook_checks.py.
#
#   pytest tests/evals/test_hybrid_rules_eval.py -m eval

cases:
  - id: call_clean
    fixture: {event_type: capital_call}
    expected:
      CE-WB-SHEETS-PRESENT: pass
      CE-WB-MERGE-TABS: pass
      CE-WB-NO-PLACEHOLDERS: pass
      CE-ALLOC-REFERENCE-INTEGRITY: pass
      CE-ALLOC-STALE-COMPONENTS: pass
      CE-ALLOC-SIGNAGE: pass
      CE-ITD-EVENT-BLOCK: pass
      CE-TIE-SUMMARY: pass
      CE-DATE-CONSISTENCY: pass

  - id: call_clean_shifted
    fixture: {event_type: capital_call, variant: shifted}
    expected:
      CE-WB-SHEETS-PRESENT: pass
      CE-WB-MERGE-TABS: pass
      CE-TIE-SUMMARY: pass
      CE-DATE-CONSISTENCY: pass

  - id: call_clean_two_vehicles
    fixture: {event_type: capital_call, variant: two_vehicles}
    expected:
      CE-WB-SHEETS-PRESENT: pass
      CE-WB-MERGE-TABS: pass
      CE-ALLOC-REFERENCE-INTEGRITY: pass

  - id: distribution_clean
    fixture: {event_type: distribution}
    expected:
      CE-ALLOC-SIGNAGE: pass
      CE-ITD-EVENT-BLOCK: pass
      CE-DIST-CARRY-SPLIT: pass
      CE-TIE-SUMMARY: pass

  - id: net_clean
    fixture: {event_type: net_event}
    expected:
      CE-NET-EVENT-STRUCTURE: pass
      CE-ALLOC-SIGNAGE: pass
      CE-TIE-SUMMARY: pass

  - id: placeholder_left
    fixture: {event_type: capital_call, defect: placeholder_left}
    expected:
      CE-WB-NO-PLACEHOLDERS: fail

  - id: tbd_pending  # FA: a pending wire date is not a placeholder
    fixture: {event_type: capital_call, defect: ok_tbd_pending}
    expected:
      CE-WB-NO-PLACEHOLDERS: pass

  - id: itd_missing_x
    fixture: {event_type: capital_call, defect: itd_missing_x}
    expected:
      CE-ITD-EVENT-BLOCK: fail

  - id: itd_overlay_rows  # FA: overlays allowed, one primary X per column
    fixture: {event_type: capital_call, defect: ok_itd_overlay_rows}
    expected:
      CE-ITD-EVENT-BLOCK: pass

  - id: stale_component
    fixture: {event_type: capital_call, defect: stale_component}
    expected:
      CE-ALLOC-STALE-COMPONENTS: fail

  - id: stale_label_inactive  # FA: leftover labels only matter on a used column
    fixture: {event_type: capital_call, defect: ok_stale_label_inactive}
    expected:
      CE-ALLOC-STALE-COMPONENTS: pass

  - id: stale_label_on_active
    fixture: {event_type: capital_call, defect: stale_label_on_active}
    expected:
      CE-ALLOC-STALE-COMPONENTS: fail

  - id: stale_fee_period
    fixture: {event_type: capital_call, defect: stale_fee_period}
    expected:
      CE-DATE-CONSISTENCY: fail
      CE-ALLOC-REFERENCE-INTEGRITY: fail

  - id: summary_line_hardcoded
    fixture: {event_type: capital_call, defect: summary_line_hardcoded}
    expected:
      CE-TIE-SUMMARY: fail

  - id: carry_split_wrong
    fixture: {event_type: distribution, defect: carry_split_wrong}
    expected:
      CE-DIST-CARRY-SPLIT: fail
